version: '3.8'

services:
  # SQL Server Database
  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: nps_sqlserver
    environment:
      SA_PASSWORD: "YourStrong@Passw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - nps_network

  # Django Dashboard Application
  django:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: nps_django
    environment:
      - DEBUG=True
      - DB_HOST=db
      - DB_PORT=1433
      - DB_NAME=survey_analytics
      - DB_USER=sa
      - DB_PASSWORD=YourStrong@Passw0rd
      - SECRET_KEY=django-insecure-docker-dev-key-change-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./dashboard:/app
    networks:
      - nps_network

  # FastAPI Collector Application
  fastapi:
    build:
      context: .
      dockerfile: collector/Dockerfile
    container_name: nps_fastapi
    environment:
      - DB_HOST=db
      - DB_PORT=1433
      - DB_NAME=survey_analytics
      - DB_USER=sa
      - DB_PASSWORD=YourStrong@Passw0rd
    ports:
      - "8001:8001"
    depends_on:
      - db
    volumes:
      - ./collector:/app
    networks:
      - nps_network

volumes:
  sqlserver_data:

networks:
  nps_network:
    driver: bridge
