version: '3.8'

services:
  # SQL Server Database
  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: nps_sqlserver
    environment:
      SA_PASSWORD: "YourStrong@Passw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - nps_network

  # Django Admin Application
  django:
    build:
      context: .
      dockerfile: django_app/Dockerfile
    container_name: nps_django
    environment:
      - DEBUG=True
      - DB_HOST=db
      - DB_PORT=1433
      - DB_NAME=nps_surveys
      - DB_USER=sa
      - DB_PASSWORD=YourStrong@Passw0rd
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./django_app:/app
    networks:
      - nps_network

  # FastAPI Application
  fastapi:
    build:
      context: .
      dockerfile: fastapi_app/Dockerfile
    container_name: nps_fastapi
    environment:
      - DB_HOST=db
      - DB_PORT=1433
      - DB_NAME=nps_surveys
      - DB_USER=sa
      - DB_PASSWORD=YourStrong@Passw0rd
    ports:
      - "8001:8001"
    depends_on:
      - db
    volumes:
      - ./fastapi_app:/app
    networks:
      - nps_network

volumes:
  sqlserver_data:

networks:
  nps_network:
    driver: bridge
